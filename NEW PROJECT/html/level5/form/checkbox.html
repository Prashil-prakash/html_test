<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radio</title>
</head>
<body>
    <form >
        <label for="o">orange</label>
        <input type="checkbox" id="o" name="fruit" value="orange"><br>
        <label for="a">apple</label>
        <input type="checkbox" id="a" name="fruit" value="apple"><br>
        <label for="m">mango</label>
        <input type="checkbox" id="m" name="fruit" value="mango"><br>
    </form>
    
</body>
</html>
